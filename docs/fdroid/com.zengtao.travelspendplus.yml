Categories:
  - Finance Manager
License: MIT
AuthorName: zengtao227
SourceCode: https://gitlab.com/zengtao227/TravelSpendPlus
IssueTracker: https://github.com/zengtao227/TravelSpendPlus/issues
Changelog: https://github.com/zengtao227/TravelSpendPlus/releases

AutoName: TravelSpendPlus

RepoType: git
Repo: https://gitlab.com/zengtao227/TravelSpendPlus.git

Builds:
  - versionName: 1.0.1
    versionCode: 14
    commit: a591b78dc537d0d11811ca35365ee3b55b5a9760
    subdir: app
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.44.7
    rm:
      - app/ios
      - app/linux
      - app/macos
      - app/web
      - app/windows
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    scandelete:
      - app/.pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: app/pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.1
CurrentVersionCode: 14
